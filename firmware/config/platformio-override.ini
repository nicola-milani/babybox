; ============================================================
;  platformio-override.ini — ambiente del nostro box
; ------------------------------------------------------------
;  La copia buona sta in boxaudiobimbo/firmware/config/ e arriva nel fork
;  con ./firmware/applica-config.sh (in ESPuino questo nome e' in
;  .gitignore apposta per le personalizzazioni).
;
;  ATTENZIONE, lezione imparata il 17 ottobre: NON scrivere qui
;  "platform = espressif32" e NON fare "extends = env:esp32-s3-devkitc-1".
;  L'ambiente S3 di ESPuino contiene quella riga, che scavalca la
;  piattaforma pinnata in [env] (pioarduino 55.03.311) e installa quella
;  ufficiale. Il framework Arduino di quest'ultima non ha idf_component.yml,
;  quindi non viene creata la cartella managed_components/ e la build muore
;  su board_build.embed_txtfiles ("https_server.crt not found").
;  La CI di ESPuino non lo vede perche' compila solo schede ESP32.
;  Qui ereditiamo [env] e basta.
;
;  Differenze dall'ambiente S3 di ESPuino, tarato su 8 MB e senza PSRAM:
;    - flash 16 MB e partizioni con OTA (N16R8)
;    - PSRAM octal (qio_opi)
;    - HAL 99, cioe' settings-custom.h
;    - log sulla USB nativa (UART0 e' occupata dal DS3231)
; ============================================================

[platformio]
default_envs = boxstorie

[env:boxstorie]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3

; N16R8: 16 MB di flash, partizioni con OTA
board_build.partitions = custom_16mb_ota.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; PSRAM octal + flash quad
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio

; La PSRAM octal si configura in sdkconfig.defaults.esp32s3, non qui:
; "custom_sdkconfig" di pioarduino viene ignorato quando il framework e'
; "arduino, espidf", come in ESPuino.

; L'ESP32-S3 non ha il Bluetooth Classic: la libreria A2DP si rifiuta di
; compilare ("Please read the ESP32-A2DP Wiki about the supported Platforms").
; Noi il Bluetooth lo abbiamo gia' spento in settings-override.h, ma la
; libreria sta in lib_deps e verrebbe compilata lo stesso: la escludiamo.
lib_ignore = ESP32-A2DP

build_flags = ${env.build_flags}
              -DHAL=99
              -DLOG_BUFFER_SIZE=10240
              -DBOARD_HAS_PSRAM
              -DBOARD_HAS_16MB_FLASH_AND_OTA_SUPPORT
              -DARDUINO_USB_CDC_ON_BOOT=1    ; i log escono dalla USB nativa:
              -DARDUINO_USB_MODE=1           ; UART0 (43/44) e' occupata dal DS3231

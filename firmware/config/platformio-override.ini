; ============================================================
;  platformio-override.ini — ambiente del nostro box
; ------------------------------------------------------------
;  La copia buona sta in boxaudiobimbo/firmware/config/ e arriva nel fork
;  con ./firmware/applica-config.sh (in ESPuino questo nome e' in
;  .gitignore apposta per le personalizzazioni).
;
;  Differenze dall'ambiente esp32-s3-devkitc-1 di ESPuino, che e' tarato
;  su 8 MB di flash e non accende la PSRAM:
;    - flash 16 MB e partizioni con OTA (N16R8)
;    - PSRAM octal (opi): senza questa riga la N16R8 non la vede
;    - HAL 99, cioe' settings-custom.h
; ============================================================

[platformio]
default_envs = boxstorie

[env:boxstorie]
extends = env:esp32-s3-devkitc-1
board = esp32-s3-devkitc-1
platform = espressif32
board_build.mcu = esp32s3

; N16R8: 16 MB di flash, partizioni con OTA
board_build.partitions = custom_16mb_ota.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; PSRAM octal + flash quad
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio

build_flags = ${env.build_flags}
              -DHAL=99
              -DLOG_BUFFER_SIZE=10240
              -DBOARD_HAS_PSRAM
              -DBOARD_HAS_16MB_FLASH_AND_OTA_SUPPORT
              -DARDUINO_USB_CDC_ON_BOOT=1    ; i log escono dalla USB nativa:
              -DARDUINO_USB_MODE=1           ; UART0 (43/44) e' occupata dal DS3231
